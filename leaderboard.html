<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Leaderboard of online conformal and Bayesian calibration methods for Timestral forecasts, across every bundled synthetic and real dataset." />
    <title>Leaderboard · Timestral Uncertainty Arena</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 22 Q8 6 14 16 T30 8' fill='none' stroke='%23202020' stroke-width='3'/%3E%3C/svg%3E" />
  </head>
  <body class="lb">
    <header class="topbar lb-top">
      <div class="brand"><h1>Leaderboard</h1></div>
      <a class="back" href="./index.html">← Workspace</a>
      <div class="lb-tools">
        <label class="inline-field">Model <select id="run"></select></label>
        <button id="btn-csv" class="primary" title="All datasets × methods of this run, one line each">Download CSV</button>
      </div>
    </header>

    <main class="content lb-content">
      <p class="lb-meta muted" id="meta"></p>

      <details class="card lb-disclosure" id="findings-card">
        <summary><h2>Benchmark notes</h2></summary>
        <div class="notes-body">
          <p class="muted small" id="run-config"></p>
          <h3>Findings</h3>
          <ul class="findings" id="findings"></ul>
          <div class="caveats"><h3>Caveats</h3><ul id="caveats"></ul></div>
        </div>
      </details>

      <section class="card">
        <div class="row-between">
          <h2>Overall <span class="muted small" id="overall-sub"></span></h2>
          <div class="seg" id="group" role="group" aria-label="Datasets to include"></div>
        </div>
        <div class="rank-wrap" tabindex="0" aria-label="Overall rankings"><table class="lbt" id="overall"></table></div>
        <p class="footnote-sm">Lower ranks and scores are better. Score vs native: below 1 beats the model.</p>
      </section>

      <details class="card lb-disclosure">
        <summary><h2>Ranks by dataset</h2></summary>
        <div class="rank-wrap matrix-wrap" tabindex="0" aria-label="Ranks by dataset"><table class="lbt matrix" id="matrix"></table></div>
        <p class="footnote-sm matrix-key">
          <span>Darker = better</span>
          <span><b>=</b> tied rank</span>
          <span><span class="reddot"></span><span id="under-note">coverage below target</span></span>
        </p>
      </details>

      <section class="card" id="detail-card">
        <div class="row-between">
          <h2 id="detail-title">Dataset</h2>
          <select id="dataset" aria-label="Dataset"></select>
        </div>
        <p class="muted small" id="detail-meta"></p>
        <div class="rank-wrap" tabindex="0" aria-label="Dataset rankings"><table class="lbt" id="detail"></table></div>
      </section>
    </main>
    <div class="lb-tip hidden" id="tip" role="tooltip"></div>
    <script type="module" src="/src/leaderboard/main.ts"></script>
  </body>
</html>
